<figure class="media-item">
  {% if m.media_type == 'image' %}
    <img src="{{ url_for('uploaded_file', filename=m.filename) }}" alt="{{ m.title }}">
  {% else %}
    <video src="{{ url_for('uploaded_file', filename=m.filename) }}" controls preload="metadata"></video>
  {% endif %}
  <figcaption><strong>{{ m.title }}</strong>{% if m.description %}<br>{{ m.description }}{% endif %}</figcaption>
</figure>
